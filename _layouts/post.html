---
layout: default
---

<div class="page-content">
  <article>
    <div class="post-header">
      <div class="container--narrow">
        <div class="post-meta">
          {% if page.category %}<span class="category">{{ page.category }}</span>{% endif %}
          <time datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%d. %B %Y" }}
          </time>
        </div>
        <h1>{{ page.title }}</h1>
      </div>
    </div>

    {% if page.cover_image %}
    <div class="post-cover container">
      <img src="{{ page.cover_image | relative_url }}" alt="{{ page.cover_alt | default: page.title }}">
    </div>
    {% endif %}

    <div class="container--narrow">
      <div class="post-content">
        {{ content }}
      </div>

      <div style="padding-top: 2rem; border-top: 1px solid #e5e0d8;">
        <a href="{{ '/blog/' | relative_url }}" class="btn">← Alle Beiträge</a>
      </div>
    </div>
  </article>
</div>
