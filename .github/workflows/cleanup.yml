name: Cleanup Preview (PR closed)

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Sanitize branch name
        id: branch
        run: |
          SAFE=$(echo "${{ github.head_ref }}" | sed 's|[/_]|-|g' | tr '[:upper:]' '[:lower:]')
          echo "name=$SAFE" >> $GITHUB_OUTPUT

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          PREVIEW_DIR="preview/${{ steps.branch.outputs.name }}"
          if [ -d "$PREVIEW_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PREVIEW_DIR"
            git commit -m "cleanup: remove preview/${{ steps.branch.outputs.name }}"
            git push
            echo "Preview directory removed: $PREVIEW_DIR"
          else
            echo "No preview directory found, nothing to clean up."
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-deployment -->';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              const merged = context.payload.pull_request.merged;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n## ~~🎨 Preview Deployment~~\n\nPreview wurde ${merged ? 'nach dem Merge' : 'beim Schließen des PRs'} automatisch gelöscht.`,
              });
            }
