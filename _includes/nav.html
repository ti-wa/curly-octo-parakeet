<header class="site-header" id="site-header">
  <div class="container">
    <div class="site-header__inner">
      <a href="{{ '/' | relative_url }}" class="site-logo">{{ site.author }}</a>

      <button class="nav-toggle" id="nav-toggle" aria-label="Menü öffnen">
        <span></span><span></span><span></span>
      </button>

      <nav>
        <ul class="site-nav" id="site-nav">
          <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Start</a></li>
          <li><a href="{{ '/galerie/' | relative_url }}" {% if page.url contains '/galerie' %}class="active"{% endif %}>Galerie</a></li>
          <li><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a></li>
          <li><a href="{{ '/ueber/' | relative_url }}" {% if page.url contains '/ueber' %}class="active"{% endif %}>Über mich</a></li>
          <li><a href="{{ '/#kontakt' | relative_url }}" class="btn btn--filled">Kontakt</a></li>
        </ul>
      </nav>
    </div>

</header>
